<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bravia · Tienda online</title>
<meta name="description" content="Bravia: prendas para el día a día. Elegí tus prendas o hacé tu pedido personalizado por WhatsApp. Asunción, Paraguay.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bravia · Tienda online">
<meta property="og:description" content="Elegí tus prendas o hacé tu pedido personalizado por WhatsApp.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%231c1b1a'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' text-anchor='middle' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#f6f5f3; --ink:#1c1b1a; --muted:#85817b; --line:#e6e3df;
  --accent:#5b5e4a; --on-accent:#ffffff; --wa:#25d366;
  --serif:"Italiana","Didot","Bodoni 72",Georgia,serif;
  --sans:"Jost","Avenir Next","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151514; --surface:#1f1f1d; --ink:#efece7; --muted:#9a968f; --line:#2e2d2a;
    --accent:#b9bd9f; --on-accent:#151514; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151514; --surface:#1f1f1d; --ink:#efece7; --muted:#9a968f; --line:#2e2d2a;
  --accent:#b9bd9f; --on-accent:#151514; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:975px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:var(--serif);font-size:30px;letter-spacing:.06em;text-decoration:none;color:var(--ink);line-height:1}
nav{display:flex;align-items:center;gap:24px}
nav a{color:var(--ink);text-decoration:none;font-size:15px;font-weight:400}
nav a[aria-current="page"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}

nav .sm{display:none}

/* Pedido personalizado */
.custom{max-width:560px;margin:0 auto}
.custom-head{padding:40px 0 8px;text-align:center}
.custom-head h1{font-family:var(--serif);font-weight:400;font-size:40px;margin:0 0 10px;line-height:1.1}
.custom-head p{margin:0 auto;color:var(--muted);max-width:44ch}
.custom form{margin-top:28px;gap:18px}
.custom fieldset{border:0;padding:0;margin:0}
.custom legend{font-size:13px;color:var(--muted);margin-bottom:8px;padding:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative;display:inline-flex;flex-direction:row;align-items:center;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;color:var(--ink);cursor:pointer}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.custom .send{margin-top:10px}
.custom .note{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 0}
.cart-link{display:inline-flex;align-items:center;gap:6px;position:relative}
.cart-link svg{width:22px;height:22px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:500;display:inline-grid;place-items:center}
.badge[hidden]{display:none}

main{max-width:975px;margin:0 auto;padding:0 20px 120px}

/* Perfil estilo Instagram */
.profile{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 0 28px;text-align:center}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--serif);font-size:30px;line-height:1}
.profile h1{margin:0;font-weight:400;font-size:20px}
.profile p{margin:0;color:var(--muted);max-width:42ch}
.profile .wa-inline{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:400;font-size:14px}
.profile .wa-inline svg{width:16px;height:16px;fill:var(--wa)}

/* Categorías como historias destacadas */
.highlights{display:flex;gap:22px;overflow-x:auto;padding:4px 2px 24px;scrollbar-width:none}
.highlights::-webkit-scrollbar{display:none}
.hl{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.hl span.ring{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);padding:3px;display:block}
.hl span.ring i{display:block;width:100%;height:100%;border-radius:50%;background:var(--surface);background-size:cover;background-position:center}
.hl[aria-pressed="true"] span.ring{border-color:var(--ink)}
.hl small{font-size:12px;color:var(--ink)}

/* Grilla */
.tabs{border-top:1px solid var(--line);display:flex;justify-content:center;margin-bottom:4px}
.tabs span{border-top:1px solid var(--ink);margin-top:-1px;padding:14px 0;font-size:13px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 28px;padding-top:16px}
.card{display:flex;flex-direction:column}
.sq{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--surface)}
.sq img{width:100%;height:100%;object-fit:cover}
.sq .soldout{position:absolute;inset:auto 8px 8px auto;background:var(--bg);font-size:12px;padding:2px 8px;border-radius:4px}
.info{padding:12px 2px 0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:400;font-size:15px}
.price{font-size:14px;color:var(--muted);white-space:nowrap}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.size{border:1px solid var(--line);background:none;border-radius:6px;min-width:34px;height:30px;font-size:13px;padding:0 8px}
.size[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.add{border:1px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:8px;height:38px;font-size:14px;font-weight:400;transition:background .2s,color .2s}
.add:hover{background:var(--ink);color:var(--bg)}
.add.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{font-size:12px;color:#b4533c;min-height:0;margin:-4px 0 0}

/* Carrito */
.cart-head{padding:36px 0 20px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line)}
.cart-head h1{font-family:var(--serif);font-weight:400;font-size:40px;margin:0;line-height:1}
.back{color:var(--muted);font-size:14px}
.cart-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;padding-top:8px}
.item{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
.item .sq{width:96px}
.item .meta{font-size:13px;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.qty button{background:none;border:0;width:32px;height:30px;font-size:16px}
.qty span{min-width:22px;text-align:center;font-size:14px}
.remove{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:0;margin-left:12px}
.line-total{font-size:15px;white-space:nowrap}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;background:var(--surface);border-radius:12px;padding:24px;margin-top:18px}
.summary h2{font-weight:400;font-size:18px;margin:0 0 16px}
.sum-row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:var(--muted)}
.sum-total{display:flex;justify-content:space-between;font-size:20px;font-weight:400;border-top:1px solid var(--line);margin-top:10px;padding-top:14px}
form{display:flex;flex-direction:column;gap:12px;margin-top:20px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
textarea{resize:vertical;min-height:64px}
.send{margin-top:6px;border:0;border-radius:8px;height:48px;background:var(--wa);color:#0b2e17;font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.send svg{width:20px;height:20px;fill:currentColor}
.send:disabled{opacity:.45;cursor:not-allowed}
.empty{text-align:center;padding:72px 0}
.empty p{color:var(--muted);margin:0 0 18px}
.btn{display:inline-block;border:1px solid var(--ink);border-radius:8px;padding:10px 22px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:400}

/* WhatsApp flotante */
.wa-float{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:25}
.wa-float svg{width:30px;height:30px;fill:#fff}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px;padding:36px 20px 100px;display:flex;flex-direction:column;align-items:center;gap:8px}
footer p{margin:0}
footer .foot-brand{font-family:var(--serif);font-size:26px;color:var(--ink);letter-spacing:.06em;margin-bottom:6px}
footer a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
footer a:hover{text-decoration:underline;text-underline-offset:4px}
footer svg{width:16px;height:16px}

@media (max-width:760px){
  .profile{padding:24px 0 20px}
  .avatar{width:60px;height:60px;font-size:26px}
  .grid{grid-template-columns:repeat(2,1fr);gap:28px 14px}
  .cart-layout{grid-template-columns:1fr;gap:0}
  .summary{position:static}
  nav{gap:16px}
  .nav-extra{display:none}
  nav .lg{display:none}
  nav .sm{display:inline}
  .two{grid-template-columns:1fr}
  .custom-head h1{font-size:32px}
  .logo{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="#tienda" aria-label="Bravia, inicio">BRAVIA</a>
    <nav aria-label="Principal">
      <a href="#tienda" id="nav-shop">Tienda</a>
      <a href="#pedido" id="nav-custom"><span class="lg">Pedido personalizado</span><span class="sm">Personalizado</span></a>
      <a href="#carrito" id="nav-cart" class="cart-link" aria-label="Carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="badge" id="badge" hidden>0</span>
      </a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <p class="foot-brand">BRAVIA</p>
  <p><a id="foot-wa" target="_blank" rel="noopener"><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3Zm0 23.4c-2.1 0-4.1-.6-5.8-1.6l-.4-.2-3.8 1.2 1.2-3.7-.3-.4a10.4 10.4 0 0 1-1.7-5.8C5.2 9.9 10 5.2 16 5.2s10.8 4.7 10.8 10.6S22 26.4 16 26.4Z"/></svg>+595 994 750882</a></p>
  <p><a href="https://www.instagram.com/bravia.py?vrfl=MWZ6bTRoeXNpeWsydA==" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>@bravia.py</a></p>
  <p>Owner: Iara Sequeira</p>
</footer>

<a class="wa-float" id="wa-float" target="_blank" rel="noopener" aria-label="Escribir a Bravia por WhatsApp">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3Zm0 23.4c-2.1 0-4.1-.6-5.8-1.6l-.4-.2-3.8 1.2 1.2-3.7-.3-.4a10.4 10.4 0 0 1-1.7-5.8C5.2 9.9 10 5.2 16 5.2s10.8 4.7 10.8 10.6S22 26.4 16 26.4Zm5.9-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.8 8.8 0 0 1-4.4-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4s-1.2 1.1-1.2 2.7 1.2 3.1 1.4 3.3c.2.2 2.3 3.5 5.6 4.9 2.1.9 2.9.9 4 .8.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4Z"/></svg>
</a>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   CONFIGURACIÓN — editá estos datos
   ============================================================ */
const CONFIG = {
  // Número de WhatsApp de la dueña, con código de país, sin + ni espacios
  whatsapp: "595994750882",
  mensajeConsulta: "Hola Bravia, quisiera hacer una consulta...",
  moneda: "Gs.",
  nombreTienda: "Bravia",
  bio: "Prendas pensadas para el día a día. Envíos en Asunción y alrededores."
};

/* Imágenes de muestra (siluetas). Reemplazá "img" por la URL o foto de cada prenda. */
const sil = (tone, path) => "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'><rect width='400' height='400' fill='${tone}'/><g fill='none' stroke='#ffffff' stroke-width='3' stroke-linejoin='round' opacity='.85'>${path}</g></svg>`);
const SHAPES = {
  vestido: "<path d='M170 90h60l10 50-20 20 60 160H120l60-160-20-20z'/><path d='M180 90q20 20 40 0'/>",
  top: "<path d='M150 120l30-20q20 18 40 0l30 20 40 40-25 25-25-20v140H160V165l-25 20-25-25z'/>",
  pantalon: "<path d='M150 90h100l15 230h-50l-15-170-15 170h-50z'/><path d='M150 110h100'/>",
  falda: "<path d='M160 120h80l50 180H110z'/><path d='M160 140h80'/>",
  blazer: "<path d='M150 100l50 30 50-30 50 40-15 180H115l-15-180z'/><path d='M200 130v190M200 130l-25 70M200 130l25 70'/>",
  bolso: "<path d='M120 170h160l-15 140H135z'/><path d='M160 170q0-60 40-60t40 60'/>"
};

const PRODUCTOS = [
  { id:"p1", nombre:"Vestido Lino Arena",  precio:289000, categoria:"Vestidos",   talles:["S","M","L"], img:sil("#cbbfae",SHAPES.vestido) },
  { id:"p2", nombre:"Top Seda Marfil",     precio:159000, categoria:"Tops",       talles:["S","M","L"], img:sil("#d9d2c7",SHAPES.top) },
  { id:"p3", nombre:"Pantalón Sastrero",   precio:249000, categoria:"Pantalones", talles:["36","38","40","42"], img:sil("#8e8a7e",SHAPES.pantalon) },
  { id:"p4", nombre:"Falda Midi Oliva",    precio:199000, categoria:"Faldas",     talles:["S","M","L"], img:sil("#7d8068",SHAPES.falda) },
  { id:"p5", nombre:"Blazer Oversize",     precio:379000, categoria:"Abrigos",    talles:["S","M","L"], img:sil("#5f5c56",SHAPES.blazer) },
  { id:"p6", nombre:"Vestido Negro Slip",  precio:269000, categoria:"Vestidos",   talles:["S","M","L"], img:sil("#3b3a38",SHAPES.vestido) },
  { id:"p7", nombre:"Top Tejido Crudo",    precio:139000, categoria:"Tops",       talles:["Único"],     img:sil("#e3ddd3",SHAPES.top) },
  { id:"p8", nombre:"Pantalón Lino Blanco",precio:229000, categoria:"Pantalones", talles:["36","38","40"], img:sil("#c9c6bf",SHAPES.pantalon) },
  { id:"p9", nombre:"Bolso Cuero Tostado", precio:319000, categoria:"Accesorios", talles:["Único"],     img:sil("#9c7a5b",SHAPES.bolso), agotado:false }
];

/* ============================================================ */
const $ = s => document.querySelector(s);
const fmt = n => CONFIG.moneda + " " + n.toLocaleString("es-PY");
const waLink = msg => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;

let cart = [];
try { cart = JSON.parse(localStorage.getItem("bravia-cart") || "[]"); } catch(e) { cart = []; }
const save = () => { try { localStorage.setItem("bravia-cart", JSON.stringify(cart)); } catch(e) {} updateBadge(); };
const count = () => cart.reduce((a,i)=>a+i.qty,0);
const total = () => cart.reduce((a,i)=>a+i.qty*i.precio,0);

let filtro = "Todo";
const elegidos = {}; // talle seleccionado por producto

function updateBadge(){
  const b = $("#badge"); const c = count();
  b.textContent = c; b.hidden = c === 0;
}
function toast(t){
  const el = $("#toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"),1800);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Tienda ---------- */
function renderShop(){
  const cats = ["Todo", ...new Set(PRODUCTOS.map(p=>p.categoria))];
  const lista = filtro === "Todo" ? PRODUCTOS : PRODUCTOS.filter(p=>p.categoria===filtro);
  $("#app").innerHTML = `
    <section class="profile">
      <div class="avatar" aria-hidden="true">B</div>
      <h1>${esc(CONFIG.nombreTienda.toLowerCase())}.py</h1>
    </section>
    <div class="tabs"><span>${filtro === "Todo" ? "Todas las prendas" : esc(filtro)}</span></div>
    <div class="grid">
      ${lista.map(p=>`
        <article class="card">
          <div class="sq"><img src="${p.img}" alt="${esc(p.nombre)}" loading="lazy">${p.agotado?'<span class="soldout">Agotado</span>':''}</div>
          <div class="info">
            <div class="row"><span class="name">${esc(p.nombre)}</span><span class="price">${fmt(p.precio)}</span></div>
            <div class="sizes" role="group" aria-label="Talle de ${esc(p.nombre)}">
              ${p.talles.map(t=>`<button class="size" data-id="${p.id}" data-talle="${esc(t)}" aria-pressed="${elegidos[p.id]===t || p.talles.length===1}">${esc(t)}</button>`).join("")}
            </div>
            <p class="hint" id="hint-${p.id}"></p>
            <button class="add" data-add="${p.id}" ${p.agotado?"disabled":""}>Agregar al carrito</button>
          </div>
        </article>`).join("")}
    </div>`;
}

/* ---------- Carrito ---------- */
function renderCart(){
  if (!cart.length){
    $("#app").innerHTML = `
      <div class="cart-head"><h1>Carrito</h1></div>
      <div class="empty"><p>Tu carrito está vacío. Elegí tus prendas en la tienda.</p><a class="btn" href="#tienda">Ver prendas</a></div>`;
    return;
  }
  $("#app").innerHTML = `
    <div class="cart-head"><h1>Carrito</h1><a class="back" href="#tienda">Seguir comprando</a></div>
    <div class="cart-layout">
      <section aria-label="Prendas en el carrito">
        ${cart.map((i,idx)=>`
          <div class="item">
            <div class="sq"><img src="${(PRODUCTOS.find(p=>p.id===i.id)||{}).img||''}" alt=""></div>
            <div>
              <div class="name">${esc(i.nombre)}</div>
              <div class="meta">Talle ${esc(i.talle)} · ${fmt(i.precio)} c/u</div>
              <div class="qty" role="group" aria-label="Cantidad">
                <button data-dec="${idx}" aria-label="Quitar uno">−</button><span>${i.qty}</span><button data-inc="${idx}" aria-label="Agregar uno">+</button>
              </div>
              <button class="remove" data-rm="${idx}">Quitar</button>
            </div>
            <div class="line-total">${fmt(i.qty*i.precio)}</div>
          </div>`).join("")}
      </section>
      <aside class="summary">
        <h2>Resumen del pedido</h2>
        <div class="sum-row"><span>Prendas</span><span>${count()}</span></div>
        <div class="sum-row"><span>Envío</span><span>A coordinar</span></div>
        <div class="sum-total"><span>Total</span><span>${fmt(total())}</span></div>
        <form id="order" novalidate>
          <label>Nombre y apellido<input name="nombre" required autocomplete="name"></label>
          <label>Entrega
            <select name="entrega" id="entrega">
              <option>Delivery</option><option>Retiro en tienda</option>
            </select>
          </label>
          <label id="dir-wrap">Dirección o barrio<input name="direccion" autocomplete="street-address"></label>
          <label>Forma de pago
            <select name="pago"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option></select>
          </label>
          <label>Notas (opcional)<textarea name="notas" placeholder="Horario de entrega, color alternativo…"></textarea></label>
          <button class="send" type="submit">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3Z"/></svg>
            Enviar pedido por WhatsApp
          </button>
        </form>
      </aside>
    </div>`;
}

function buildOrderMessage(f){
  const lineas = cart.map((i,n)=>`${n+1}. ${i.nombre} — Talle ${i.talle} — x${i.qty} — ${fmt(i.qty*i.precio)}`);
  return [
    `Hola Bravia, quiero hacer este pedido:`,
    ``,
    ...lineas,
    ``,
    `*Total: ${fmt(total())}* (${count()} prenda${count()>1?"s":""})`,
    ``,
    `Nombre: ${f.nombre}`,
    `Entrega: ${f.entrega}${f.entrega==="Delivery" && f.direccion ? " — " + f.direccion : ""}`,
    `Pago: ${f.pago}`,
    f.notas ? `Notas: ${f.notas}` : null
  ].filter(l=>l!==null).join("\n");
}

/* ---------- Pedido personalizado ---------- */
function renderCustom(){
  const hoy = new Date().toISOString().slice(0,10);
  $("#app").innerHTML = `
    <div class="custom">
      <div class="custom-head">
        <h1>Pedido personalizado</h1>
      </div>
      <form id="custom" novalidate>
        <fieldset>
          <legend>Tipo de prenda</legend>
          <div class="pills">
            ${["Blusa","Pollera","Conjunto","Vestido"].map((t,i)=>`<label class="pill"><input type="radio" name="tipo" value="${t}" ${i===0?"checked":""}>${t}</label>`).join("")}
          </div>
        </fieldset>
        <label>Nombre y apellido<input name="nombre" required autocomplete="name"></label>
        <div class="two">
          <label>Para qué fecha la necesitás<input type="date" name="fecha" min="${hoy}" required></label>
          <label>Talle<input name="talle" placeholder="Ej.: M, 38, a medida"></label>
        </div>
        <label>Detalles de la prenda<textarea name="detalles" rows="5" required placeholder="Largo, tipo de manga, escote, ocasión, alguna referencia…"></textarea></label>
        <button class="send" type="submit">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3Z"/></svg>
          Enviar pedido por WhatsApp
        </button>
        <p class="note">Si tenés una foto de referencia, podés adjuntarla en el chat.</p>
      </form>
    </div>`;
}

function buildCustomMessage(f){
  const [y,m,d] = f.fecha.split("-");
  return [
    `Hola Bravia, quisiera hacer un pedido personalizado:`,
    ``,
    `Prenda: ${f.tipo}`,
    f.talle ? `Talle: ${f.talle}` : null,
    `Detalles: ${f.detalles}`,
    ``,
    `Nombre: ${f.nombre}`,
    `Fecha en que la necesito: ${d}/${m}/${y}`,
    ``,
    `Quedo atenta a su respuesta. ¡Gracias!`
  ].filter(l=>l!==null).join("\n");
}

/* ---------- Router ---------- */
function route(){
  const h = location.hash;
  const view = h === "#carrito" ? "carrito" : h === "#pedido" ? "pedido" : "tienda";
  [["#nav-shop","tienda"],["#nav-custom","pedido"],["#nav-cart","carrito"]].forEach(([sel,v])=>{
    view===v ? $(sel).setAttribute("aria-current","page") : $(sel).removeAttribute("aria-current");
  });
  if (view==="carrito") renderCart();
  else if (view==="pedido") renderCustom();
  else renderShop();
  window.scrollTo(0,0);
}

/* ---------- Eventos ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.cat){ filtro = t.dataset.cat; renderShop(); return; }
  if (t.dataset.talle){
    elegidos[t.dataset.id] = t.dataset.talle;
    t.parentElement.querySelectorAll(".size").forEach(b=>b.setAttribute("aria-pressed", b===t));
    $("#hint-"+t.dataset.id).textContent = "";
    return;
  }
  if (t.dataset.add){
    const p = PRODUCTOS.find(x=>x.id===t.dataset.add);
    const talle = p.talles.length===1 ? p.talles[0] : elegidos[p.id];
    if (!talle){ $("#hint-"+p.id).textContent = "Elegí un talle para agregarla."; return; }
    const ex = cart.find(i=>i.id===p.id && i.talle===talle);
    ex ? ex.qty++ : cart.push({id:p.id,nombre:p.nombre,precio:p.precio,talle,qty:1});
    save();
    t.classList.add("done"); t.textContent = "Agregada";
    setTimeout(()=>{ t.classList.remove("done"); t.textContent = "Agregar al carrito"; },1400);
    toast(`${p.nombre} (${talle}) agregada al carrito`);
    return;
  }
  if (t.dataset.inc){ cart[t.dataset.inc].qty++; save(); renderCart(); return; }
  if (t.dataset.dec){ const i=cart[t.dataset.dec]; i.qty>1 ? i.qty-- : cart.splice(t.dataset.dec,1); save(); renderCart(); return; }
  if (t.dataset.rm){ cart.splice(t.dataset.rm,1); save(); renderCart(); return; }
});

document.addEventListener("change", e=>{
  if (e.target.id==="entrega") $("#dir-wrap").style.display = e.target.value==="Delivery" ? "" : "none";
});

document.addEventListener("submit", e=>{
  if (e.target.id!=="order") return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  if (!f.nombre.trim()){ e.target.nombre.focus(); toast("Escribí tu nombre para enviar el pedido"); return; }
  if (f.entrega==="Delivery" && !f.direccion.trim()){ e.target.direccion.focus(); toast("Escribí tu dirección para el delivery"); return; }
  window.open(waLink(buildOrderMessage(f)), "_blank", "noopener");
});

document.addEventListener("submit", e=>{
  if (e.target.id!=="custom") return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  if (!f.nombre.trim()){ e.target.nombre.focus(); toast("Escribí tu nombre para enviar el pedido"); return; }
  if (!f.fecha){ e.target.fecha.focus(); toast("Elegí para qué fecha la necesitás"); return; }
  if (!f.detalles.trim()){ e.target.detalles.focus(); toast("Contanos los detalles de la prenda"); return; }
  window.open(waLink(buildCustomMessage(f)), "_blank", "noopener");
});

$("#wa-float").href = waLink(CONFIG.mensajeConsulta);
$("#foot-wa").href = waLink(CONFIG.mensajeConsulta);
window.addEventListener("hashchange", route);
updateBadge();
route();
</script>
</body>
</html>
